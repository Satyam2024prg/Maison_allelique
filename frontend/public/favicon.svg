<?xml version="1.0" encoding="UTF-8"?>
<!--
  Maison Allélique — favicon.
  Hand-drawn double oval, 8 irregular rays with terminal nodes of varying
  size, bold central node. Matches components/RadialMark.jsx.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <title>Maison Allélique</title>
  <g fill="none" stroke="#0A0A0A" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 50 8.5 C 74.5 8.5, 91.0 25.5, 91.5 50.5 C 92.0 74.0, 74.5 92.0, 50.5 92.5 C 26.5 92.8, 9.5 75.0, 9.0 51.0 C 8.8 26.5, 25.5 8.8, 50 8.5 Z"/>
    <path d="M 50 12.5 C 71.5 12.8, 87.5 27.0, 88.0 50.5 C 88.5 72.5, 72.0 88.5, 50.5 88.8 C 29.0 89.0, 13.5 74.0, 13.0 51.5 C 12.7 28.0, 28.5 12.5, 50 12.5 Z"/>

    <!-- Ray 0°  (top) -->
    <line x1="50" y1="51" x2="50" y2="23.5" stroke-width="0.85"/>
    <!-- Ray 46° (upper-right) -->
    <line x1="50" y1="51" x2="62.59" y2="38.85" stroke-width="0.85"/>
    <!-- Ray 95° (right) -->
    <line x1="50" y1="51" x2="71.92" y2="52.92" stroke-width="0.85"/>
    <!-- Ray 138° (lower-right) -->
    <line x1="50" y1="51" x2="64.05" y2="66.62" stroke-width="0.85"/>
    <!-- Ray 178° (bottom) -->
    <line x1="50" y1="51" x2="50.72" y2="71.49" stroke-width="0.85"/>
    <!-- Ray 216° (lower-left) -->
    <line x1="50" y1="51" x2="40.89" y2="63.53" stroke-width="0.85"/>
    <!-- Ray 262° (left) -->
    <line x1="50" y1="51" x2="28.21" y2="47.94" stroke-width="0.85"/>
    <!-- Ray 312° (upper-left) -->
    <line x1="50" y1="51" x2="37.00" y2="39.29" stroke-width="0.85"/>

    <g fill="#0A0A0A" stroke="none">
      <circle cx="50" cy="23.5" r="2.2"/>
      <circle cx="62.59" cy="38.85" r="1.9"/>
      <circle cx="71.92" cy="52.92" r="2.1"/>
      <circle cx="64.05" cy="66.62" r="2.1"/>
      <circle cx="50.72" cy="71.49" r="1.7"/>
      <circle cx="40.89" cy="63.53" r="1.9"/>
      <circle cx="28.21" cy="47.94" r="2.0"/>
      <circle cx="37.00" cy="39.29" r="1.9"/>
      <circle cx="50" cy="51" r="2.6"/>
    </g>
  </g>
</svg>
